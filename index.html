    <!DOCTYPE html>
<html lang="ka">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>For My Love 💜</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;1,400&family=Plus+Jakarta+Sans:wght@300;400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <canvas id="emoji-canvas"></canvas>

  <div class="container">
    <h1>Thinking Of You 💜</h1>
    <p class="subtitle"></p>

    <!-- Battery Card -->
    <div class="card">
      <p style="color: #d1c4e9; font-size: 0.85rem; letter-spacing: 1.5px; margin-bottom: 10px;">LOVE BATTERY</p>
      
      <!-- უშუალოდ ბატარიაზეა დაჭერა შესაძლებელი (id="battery-btn") -->
      <div class="battery-outer" id="battery-btn">
        <div class="battery-body">
          <div class="battery-level" id="battery-fill"></div>
          <span class="battery-percentage" id="battery-text">1%</span>
        </div>
        <div class="battery-cap"></div>
      </div>

      <div class="battery-status" id="battery-status-msg">Battery Low! Needs your love 🥺</div>
      <div class="reason-text" id="reason-display">Tap the battery to send love... ✨</div>
    </div>
  </div>

  <!-- Animated Waves Bottom -->
  <div class="ocean">
    <div class="wave"></div>
    <div class="wave"></div>
  </div>

  <script src="script.js"></script>
</body>
</html>
    <script src="/script.js"></script>
  </body>

</html>
